<!DOCTYPE html>
<html>
  <body style="margin:0; padding:32px; background-color:#F7F2E7; font-family:-apple-system, Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" style="max-width:420px; margin:0 auto;">
      <tr>
        <td style="text-align:center; padding-bottom:24px;">
          <span style="font-size:28px; color:#2B50E0; font-weight:bold;">PoBo</span>
        </td>
      </tr>
      <tr>
        <td style="background-color:#FCFAF2; border-radius:20px; padding:32px; text-align:center;">
          <p style="color:#1A1A2E; font-size:16px; margin:0 0 16px;">Your sign-in code:</p>
          <p style="color:#1A1A2E; font-size:36px; font-weight:bold; letter-spacing:8px; margin:0 0 16px;">
            {{ .Token }}
          </p>
          <p style="color:#5B5B72; font-size:14px; margin:0;">Expires shortly. Didn't request this? Ignore this email.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
